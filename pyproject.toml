[project]
name = "mireye-mcp"
version = "0.7.3"
description = "Install and diagnose Mireye hosted MCP connections; no local MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mireye" }]
keywords = ["mcp", "model-context-protocol", "geospatial", "claude", "cursor", "mireye"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://api.mireye.com"
Repository = "https://github.com/Mireye-Labs/mireye-earth-mcp"

[project.scripts]
mireye-mcp = "mireye_earth_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mireye_earth_mcp"]
